<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Error 500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una terminal por pantalla (pistas y servidor), centrada, grande para leer a 2 m. Tema único oscuro arcade, a propósito. */
:root{
  --bg:#170D2E; --screen:#22164A; --ink:#F4F0FF; --muted:#D6CEF2; --line:#3D2E78; --dark:#0B0618;
  --cyan:#3EE6FF; --yellow:#FFD23F; --pink:#FF4FA3; --green:#5CF28B; --red:#FF5A5A;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:21px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 0%,#3A1F7A 0%,transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 4px)}
body.alarm{animation:alarm 1s steps(2,start) infinite}
@keyframes alarm{50%{background-color:#3a0d1f}}
.wrap{max-width:1040px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-block:clamp(16px,4vh,40px);display:flex;flex-direction:column;justify-content:center;gap:22px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--pixel);color:var(--yellow);text-shadow:5px 5px 0 var(--pink);font-size:clamp(40px,9vw,96px);line-height:1.15}
h2{font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.15;text-wrap:balance}
.px{font-family:var(--pixel);letter-spacing:.03em;line-height:1.6}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:16px;color:var(--muted)}
.center{text-align:center;align-items:center}

.term{background:var(--screen);border:4px solid var(--line);box-shadow:10px 10px 0 var(--dark);display:flex;flex-direction:column}
.term.alert{border-color:var(--pink)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--line);font-family:var(--mono);font-size:17px;color:var(--muted);user-select:none}
.term.alert .bar{background:var(--pink);color:var(--dark);font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:22px}

.btn{font-family:var(--pixel);font-size:clamp(13px,2.2vw,17px);line-height:1.4;border:0;cursor:pointer;padding:18px 26px;background:var(--yellow);color:var(--dark);box-shadow:0 6px 0 #B38F14;text-transform:uppercase}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #B38F14}
.btn.big{font-size:clamp(16px,3vw,26px);padding:24px 40px}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);font-size:11px;padding:10px 14px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:4px solid var(--green);outline-offset:4px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.row.c{justify-content:center}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* menú */
.menu{display:flex;flex-direction:column;gap:16px}
.menu-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.menu-h h1{font-size:clamp(36px,5vw,56px)}
.menu-net{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cards .card:first-child{grid-column:1/-1}
.card{display:flex;flex-direction:column;gap:4px;padding:14px 18px;background:var(--screen);color:var(--ink);text-decoration:none;border-top:5px solid var(--c,var(--cyan))}
.card:hover{background:#2b1d5c}
.card b{font-family:var(--pixel);font-size:12px;color:var(--c,var(--cyan));line-height:1.6}
.card strong{font-size:20px}
.card span{font-size:16px;color:var(--muted)}
.card code{font-family:var(--mono);font-size:16px;color:var(--yellow);overflow-wrap:anywhere;margin-top:4px}
.net{font-family:var(--pixel);font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.net.on{color:var(--green)} .net.off{color:var(--red)}
.term.alert .bar .net{color:var(--dark)}
.tclock{font-family:var(--pixel);font-size:15px;color:var(--yellow);font-variant-numeric:tabular-nums}
.tclock.warn{color:var(--pink)} .tclock.crit{color:var(--red)}
.team{display:flex;gap:6px}
.team i{font-style:normal;font-family:var(--pixel);font-size:13px;width:26px;height:26px;display:grid;place-items:center;background:var(--dark);color:#5a4b8f}
.team i.on{background:var(--c);color:var(--dark);box-shadow:0 0 0 2px var(--dark)}
.waitbody{gap:16px;padding-block:48px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;background:var(--c);color:var(--dark);font-family:var(--pixel);font-size:13px;line-height:1.6;padding:14px 20px;box-shadow:6px 6px 0 var(--dark);animation:pop .35s ease-out;max-width:calc(100vw - 32px);text-align:center}
/* servidor en dos columnas para que entre en una notebook */
.body.srv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;text-align:center}
@media (max-width:900px){.body.srv{grid-template-columns:1fr}}
.srv-l,.srv-r{display:flex;flex-direction:column;gap:16px;align-items:center}
.srv-l{container-type:inline-size;width:100%}
.srv .clock{font-size:min(18cqw,112px);white-space:nowrap;letter-spacing:0}
.tablero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.tb{background:var(--dark);padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 3px var(--line)}
.tb .px{font-size:13px;color:var(--c)}
.tb b{font-family:var(--pixel);font-weight:400;font-size:11px;color:var(--muted)}
.tb.ok{box-shadow:inset 0 0 0 3px var(--c)}
.tb.ok b{color:var(--c)}
.srv .slots input{width:clamp(60px,7vw,100px);height:clamp(80px,10vw,124px);font-size:clamp(36px,5vw,64px)}
.srv h2{font-size:clamp(24px,3vw,34px)}
.srv .btn.big{font-size:clamp(16px,1.6vw,21px);padding:22px 30px}
.term{position:relative}
.srv .denied{position:absolute;left:24px;right:24px;bottom:24px;z-index:5;font-size:18px;padding:16px;box-shadow:8px 8px 0 var(--dark)}
.body.center h1.glitch{font-size:clamp(40px,6vw,76px)}
.body.center h2{font-size:clamp(24px,3vw,36px)}
.body.center{gap:16px}
.winterm .win,.term.alert .win{gap:12px}
.win .stats div{padding:10px}

/* pistas */
.answer{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.answer input{flex:1 1 240px;min-width:0;font-family:var(--mono);font-size:30px;font-weight:700;padding:14px 18px;background:var(--dark);color:var(--ink);border:3px solid var(--line);text-transform:uppercase}
.answer input:focus{border-color:var(--cyan);outline:none}
.fb{font-family:var(--mono);font-size:20px;min-height:1.5em}
.fb.bad{color:var(--red)}
.fb.ok{color:var(--green)}
.hint{background:var(--dark);border-left:0;padding:16px 20px;font-size:19px;color:var(--yellow)}
.cipher{font-family:var(--pixel);font-size:clamp(44px,10vw,96px);color:var(--cyan);letter-spacing:.2em;text-align:center;line-height:1.3}
.abc{font-family:var(--mono);font-size:clamp(15px,2.3vw,22px);letter-spacing:.18em;text-align:center;color:var(--muted);overflow-wrap:anywhere}
.abc b{color:var(--yellow)}
pre.code{margin:0;font-family:var(--mono);font-size:clamp(22px,3.6vw,36px);line-height:1.5;background:var(--dark);padding:22px 28px;overflow-x:auto;color:var(--ink)}
.kw{color:var(--pink)}.num{color:var(--yellow)}.fn{color:var(--cyan)}
.gloss{display:flex;flex-wrap:wrap;gap:10px}
.gloss span{font-family:var(--mono);font-size:17px;padding:6px 12px;background:var(--line)}

.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:720px){.compare{grid-template-columns:1fr}}
.phone{background:#F4F0FF;color:#1b1433;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.phone .tag{font-family:var(--pixel);font-size:11px;align-self:flex-start;padding:6px 10px;color:var(--dark)}
.phone h4{margin:0;font-size:19px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:13px;font-weight:700;color:#5b4f80}
.f .lbl{font-size:13px;font-weight:700;color:#5b4f80}
.f .val{display:block;font-family:var(--body);font-size:17px;padding:8px 10px;border:2px solid #cfc8e6;border-radius:8px;background:#fff;color:#1b1433;min-height:1.5em;overflow-wrap:anywhere;user-select:none}
.f input,.f select{font-family:var(--body);font-size:17px;padding:8px 10px;border:2px solid #cfc8e6;border-radius:8px;background:#fff;color:#1b1433;min-width:0}
.sendwrap{overflow:hidden;border-radius:8px}
.send{display:block;box-sizing:border-box;font-family:var(--body);font-weight:700;font-size:18px;border:0;border-radius:8px;padding:12px;background:#5b3fd6;color:#fff;width:100%;text-align:center;user-select:none}
.sendwrap.broken .send{text-align:left;padding-left:91%;white-space:nowrap;overflow:hidden}

.win{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:10px 0}
.digit{font-family:var(--pixel);font-size:clamp(110px,22vw,220px);line-height:1;color:var(--green);text-shadow:8px 8px 0 var(--dark)}
.stage{font-family:var(--mono);font-size:22px;padding:8px 16px;background:var(--line)}

/* servidor */
.clock{font-family:var(--pixel);font-size:clamp(64px,15vw,150px);line-height:1;text-align:center;color:var(--yellow);font-variant-numeric:tabular-nums}
.clock.warn{color:var(--pink)}
.clock.crit{color:var(--red)}
.banner{font-family:var(--pixel);font-size:clamp(14px,2.4vw,20px);text-align:center;padding:14px;background:var(--red);color:var(--dark)}
.slots{display:flex;gap:18px;justify-content:center}
.slots input{width:clamp(80px,14vw,130px);height:clamp(100px,17vw,160px);font-family:var(--pixel);font-size:clamp(44px,8vw,80px);text-align:center;background:var(--dark);color:var(--green);border:4px solid var(--line);caret-color:var(--green)}
.slots input:focus{border-color:var(--green);outline:none}
.glitch{position:relative;display:inline-block}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.slots{gap:clamp(8px,2vw,18px)}
.slots input{width:clamp(64px,12vw,120px);height:clamp(88px,15vw,150px);font-size:clamp(38px,7vw,72px)}
.cssfix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:720px){.cssfix{grid-template-columns:1fr}}
.css{font-family:var(--mono);font-size:clamp(20px,2.8vw,26px);background:var(--dark);padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prop{display:flex;align-items:center;gap:10px;padding-left:28px;flex-wrap:wrap}
.prop span{color:var(--pink)}
.prop select{font-family:var(--mono);font-size:clamp(18px,2.6vw,24px);font-weight:700;padding:8px 10px;background:var(--line);color:var(--yellow);border:2px solid var(--cyan);cursor:pointer}
.aulabox{height:140px;overflow:hidden;border:2px dashed #cfc8e6;border-radius:8px;display:flex;align-items:center;justify-content:center}
.aula{font-family:var(--pixel);line-height:1;text-align:center}
.learn{background:var(--dark);padding:16px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 2px var(--c)}
.learn .px{font-size:12px;color:var(--c)}
.learn p{font-size:clamp(18px,2.4vw,21px)}
.lesson{background:var(--dark);padding:20px 24px;display:flex;flex-direction:column;gap:10px;text-align:left;max-width:720px;width:100%;box-sizing:border-box;box-shadow:inset 0 0 0 3px var(--c)}
.lesson .px{font-size:13px;color:var(--c)}
.lesson p{font-size:clamp(18px,2.4vw,21px)}
pre.code.small-code{font-size:clamp(14px,2vw,18px);padding:14px 18px;background:#05030c}
.rules{display:flex;flex-direction:column;gap:12px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;background:var(--dark);padding:14px 16px;border:2px solid transparent}
.rule.marked-err{border-color:var(--red)}
@media (max-width:760px){.rule{grid-template-columns:1fr}}
.rule .val{display:flex;flex-direction:column;min-width:0}
.rule .val small{font-size:14px;color:var(--muted)}
.rule .val b{font-family:var(--mono);font-size:clamp(18px,2.4vw,22px);overflow-wrap:anywhere}
.rule .cond{font-size:18px}
.rule .si{font-family:var(--mono);font-weight:700;color:var(--pink)}
.rule .then{font-family:var(--mono);font-weight:700;color:var(--red);white-space:nowrap}
.pick{display:flex;gap:8px}
.pick button{font-family:var(--mono);font-weight:700;font-size:16px;padding:12px 14px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;min-height:44px}
.pick button[data-v="ok"].on{background:var(--green);border-color:var(--green);color:var(--dark)}
.pick button[data-v="err"].on{background:var(--red);border-color:var(--red);color:var(--dark)}
.ctable-wrap{overflow-x:auto;padding-bottom:6px}
.ctable{display:flex;gap:3px;width:max-content;margin:0 auto}
.clabel{display:flex;flex-direction:column;justify-content:space-around;font-family:var(--pixel);font-size:10px;color:var(--muted);padding-right:8px;gap:6px}
.ccol{display:flex;flex-direction:column;gap:3px;border:0;padding:0;background:none;cursor:pointer;font-family:var(--mono);font-weight:700}
.ccol span{display:block;width:30px;padding:8px 0;text-align:center;font-size:20px}
.ccol span:first-child{background:var(--line);color:var(--ink)}
.ccol span:last-child{background:var(--dark);color:var(--cyan)}
.ccol.hl span{background:var(--yellow)!important;color:var(--dark)!important}
.blocks-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.blocks-wrap{grid-template-columns:1fr}}
.blocks{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:clamp(19px,2.6vw,24px)}
.blk{padding:14px 18px;border-radius:10px;color:var(--dark)}
.b-set{background:var(--cyan)}
.b-add{background:var(--green)}
.b-show{background:var(--pink)}
.b-loop{background:var(--yellow);padding:0;display:flex;flex-direction:column}
.b-head{padding:14px 18px}
.b-inner{margin-left:28px;padding:6px 10px 6px 0;background:var(--screen);border-radius:8px 0 0 8px}
.b-foot{height:18px}
.blk .var{background:rgba(255,255,255,.55);padding:2px 10px;border-radius:999px}
.blk .lit{background:var(--dark);color:var(--ink);padding:2px 10px;border-radius:999px;font-family:var(--mono)}
.trace{border-collapse:collapse;width:100%;font-size:18px;background:var(--dark)}
.trace th,.trace td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
.trace th{font-family:var(--pixel);font-size:10px;color:var(--muted);font-weight:400}
.trace input{width:64px;font-family:var(--mono);font-size:22px;font-weight:700;text-align:center;background:var(--screen);color:var(--yellow);border:2px solid var(--line);padding:4px}
.prop small{flex-basis:100%;font-family:var(--body);font-size:15px;color:var(--muted);padding-left:2px}
.fact{max-width:56ch;font-size:18px;text-align:left;background:var(--dark);padding:14px 18px;border-top:4px solid var(--c);margin:6px 0 0}
.fact .px{display:block;font-size:11px;color:var(--c);margin-bottom:6px}
.mission{display:flex;flex-direction:column;gap:6px;padding:16px 20px;background:var(--dark);border-left:6px solid var(--c)}
.mission .px{font-size:11px;color:var(--c)}
.mission b{font-size:clamp(20px,2.8vw,26px)}
.mission span:last-child{font-size:18px;color:var(--muted)}
.prop small{flex-basis:100%;font-family:var(--body);font-size:15px;color:var(--muted)}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--pixel);font-size:16px}
.tries{display:flex;align-items:center;gap:10px}
.tries i{width:22px;height:22px;background:var(--line)}
.tries i.on{background:var(--green)}
.denied{display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px;background:var(--red);color:var(--dark);font-size:20px}
.denied.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.winterm{border-color:var(--green)}
.winterm .bar{background:var(--green);color:var(--dark);font-weight:700}
.party{color:var(--green);text-shadow:5px 5px 0 var(--dark);animation:party .6s steps(2,start) 6}
@keyframes party{50%{color:var(--yellow)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:640px}
.stats div{background:var(--dark);padding:14px 10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.stats span{font-size:11px;color:var(--muted)}
.stats b{font-family:var(--pixel);font-size:clamp(18px,3vw,28px);color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){.party,.denied.pop{animation:none}}
.corner{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){.blink,body.alarm,.shake{animation:none}}
.wrap:has(.split){max-width:1240px;padding-block:10px}
.split-l .answer input{flex:1 1 140px}
.split-l .fb{font-size:17px}
.split-l .hint{font-size:16px;padding:10px 14px;line-height:1.4}
.body.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:28px;align-items:start;padding:20px 28px}
.split-l{display:flex;flex-direction:column;gap:10px}
.split-r .hint{font-size:15px;padding:9px 13px;line-height:1.4}
.split-r .gloss span{font-size:15px;padding:4px 10px}
.split-l h2{font-size:clamp(26px,2.6vw,34px)}
.split-l .mission b{font-size:20px}
.split-l .mission span:last-child{font-size:17px}
.split-l .answer input{font-size:22px;padding:10px 14px}
.split .compare{gap:14px}
.split .phone{padding:12px 14px;gap:6px;border-radius:14px}
.split .phone h4{font-size:16px}
.split .phone .f{gap:2px}
.split .f .lbl{font-size:12px}
.split .f .val{padding:4px 9px;font-size:16px}
.split .send{padding:8px;font-size:16px}
@media (max-width:900px){.body.split{grid-template-columns:1fr}}
.hints{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hintbtn{font-size:12px;padding:10px 14px;color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.hint.obvia{color:var(--green)}
.clientmsg{background:#F4F0FF;color:#1b1433;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.clientmsg .px{font-size:10px;color:#5b4f80}
.clientmsg p{margin:0;font-size:20px;line-height:1.4}
.clientmsg .enc{font-family:var(--mono);background:#1b1433;color:var(--cyan);padding:2px 8px;border-radius:6px;letter-spacing:.12em}
.split .cipher{font-size:clamp(40px,5vw,72px)}
.split .abc{font-size:clamp(14px,1.5vw,18px);letter-spacing:.12em}
.split-r{display:flex;flex-direction:column;gap:14px;min-width:0}
.editor{background:#0d0a1c;border:3px solid var(--line);display:flex;flex-direction:column;min-width:0}

<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="corner"><button class="btn ghost" id="snd" type="button" hidden></button><button class="btn ghost" id="fs" type="button">Pantalla completa</button></div>

<script>
/* =========================================================
   ERROR 500 · sala de acertijos · ISFDyT N° 125
   Rutas: #cliente  #codigo  #calidad  #servidor  (sin # = menú)
   Orden de las pistas (como en un proyecto real): 1 ◆ Cliente · 2 ★ Diseño · 3 ● Código · 4 ▲ Calidad
   El código final cambia en cada partida (lo sortea el servidor). Sin conexión se usa el de respaldo: 3 - 7 - 5 - 4
   ========================================================= */
const DURATION = 10 * 60;  // segundos de juego
const MAX_TRIES = 3;       // intentos para el código final
const PENALTY = 30;        // segundos que se descuentan por código incorrecto

/* ---------------- sonido (Web Audio, sin archivos) ---------------- */
let AC = null, noiseBuf = null, master = null;
function ac(){
  try{
    if(!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    if(AC.state === "suspended") AC.resume();
  }catch(e){ AC = null; }
  return AC;
}
/* sonido: 2 = música y efectos · 1 = solo efectos · 0 = nada (se elige en el servidor y se recuerda en esa notebook) */
let SONIDO = 2; try{ const v = localStorage.getItem("e500-sonido"); if(v !== null) SONIDO = +v; }catch(e){}
function tone(f, dur=.12, type="square", vol=.06, when=0, slideTo=null){
  if(SONIDO === 0) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
}
function hat(vol=.03, when=0, dur=.04){
  if(SONIDO === 0) return;
  const a = ac(); if(!a) return;
  const t = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + .02);
}
const SFX = {
  key(){ tone(1200,.03,"square",.02); },
  ok(){ [523,659,784,1046].forEach((f,i)=>tone(f,.14,"square",.06,i*.09)); },
  bad(){ tone(196,.18,"sawtooth",.07); tone(147,.3,"sawtooth",.07,.16); },
  start(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,.12,"square",.06,i*.07)); },
  warn(){ for(let i=0;i<3;i++){ tone(880,.15,"square",.07,i*.35); tone(660,.15,"square",.07,i*.35+.17); } },
  beep(){ tone(1320,.09,"square",.08); },
  denied(){ tone(220,.25,"sawtooth",.09); tone(110,.6,"sawtooth",.1,.22,70); for(let i=0;i<3;i++) tone(880,.08,"square",.05,.9+i*.12); },
  win(){
    [523,523,523,698,880,1046,880,1046,1318].forEach((f,i)=>tone(f,.16,"square",.07,i*.12));
    [131,175,262].forEach((f,i)=>tone(f,.5,"triangle",.08,.4+i*.35));
    [784,988,1175,1568,1175,1568,2093].forEach((f,i)=>tone(f,.14,"square",.06,1.6+i*.1));
    for(let i=0;i<10;i++) hat(.05,1.6+i*.08,.06);
    tone(262,1.4,"triangle",.1,2.4); tone(330,1.4,"triangle",.08,2.4); tone(392,1.4,"triangle",.08,2.4); tone(523,1.4,"square",.04,2.4);
  },
  lose(){ [440,415,392,370,349,330,311,294].forEach((f,i)=>tone(f,.22,"sawtooth",.06,i*.2)); tone(110,1.2,"sawtooth",.08,1.6,55); }
};

/* ---- música de tensión: ostinato de bajo + hi-hat; se acelera al final ---- */
const BASS = [110,110,131,110, 98,110,147,131, 110,110,131,165, 147,131,123,98]; // La menor
const LEAD = [440,0,523,0, 494,0,440,0, 392,0,440,0, 494,0,523,587];
const music = { on:false, want:false, step:0, next:0, timer:null, bpm:116, level:0 };
function musicStart(){
  music.want = true;
  if(SONIDO < 2) return;
  const a = ac(); if(!a || music.on) return;
  music.on = true; music.step = 0; music.next = a.currentTime + .05;
  music.timer = setInterval(scheduleMusic, 25);
}
function musicStop(){ music.want = false; music.on = false; clearInterval(music.timer); }
const SONIDO_TXT = ["🔇 SIN SONIDO", "🔉 SOLO EFECTOS", "🔊 MÚSICA Y EFECTOS"];
function pintarSonido(){ const b = document.getElementById("snd"); if(b){ b.textContent = SONIDO_TXT[SONIDO]; b.setAttribute("aria-label", "Sonido: " + SONIDO_TXT[SONIDO].slice(2).toLowerCase() + ". Tocá para cambiar"); } }
function setSonido(m){
  SONIDO = m; try{ localStorage.setItem("e500-sonido", m); }catch(e){}
  if(m < 2 && music.on){ music.on = false; clearInterval(music.timer); }          // corta la música pero recuerda que estaba sonando
  if(m === 2 && music.want && !music.on){ const w = music.want; musicStart(); music.want = w; }
  pintarSonido();
}
function scheduleMusic(){
  const a = AC; if(!a || !music.on) return;
  while(music.next < a.currentTime + .12){
    const s = music.step % 16, when = music.next - a.currentTime, eighth = 60 / music.bpm / 2;
    tone(BASS[s], eighth * .9, "square", .045, when);
    if(s % 2 === 1) hat(.025, when);
    if(s % 4 === 0) tone(55, .12, "triangle", .12, when, 40);            // bombo
    if(music.level >= 1 && LEAD[s]) tone(LEAD[s], eighth*.8, "square", .025, when);
    if(music.level >= 2 && s === 0) tone(660, eighth*14, "sine", .03, when, 990); // sirena
    music.next += eighth; music.step++;
  }
}

/* ---------------- utilidades ---------------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toUpperCase();
const pad = n => String(n).padStart(2,"0");
function bar(title, alert, extra=""){
  return `<div class="bar" id="bar"><span class="dot" style="background:${alert?"#170D2E":"#FF4FA3"}"></span><span class="dot" style="background:${alert?"#170D2E":"#FFD23F"}"></span><span class="dot" style="background:${alert?"#170D2E":"#5CF28B"}"></span><span class="grow">&nbsp; ${esc(title)}</span>${extra}</div>`;
}
/* triple clic en la barra superior: en el servidor cancela la partida; en una terminal sin conexión, la reinicia */
function bindReset(fn){
  const b = document.getElementById("bar"); if(!b) return;
  let n = 0, t = null;
  b.addEventListener("click", () => { n++; clearTimeout(t); t = setTimeout(()=>n=0, 600); if(n >= 3){ n = 0; fn(); } });
}

/* ---------------- las cuatro pistas ----------------
   Orden real del trabajo: 1 ◆ Cliente → 2 ★ Diseño → 3 ● Código → 4 ▲ Calidad.
   El servidor sortea un número para cada terminal en cada partida y cada desafío se arma con ese número.
   Cada terminal además elige al azar uno de sus "casos" (formas distintas del mismo desafío). */
const ORDEN_P = ["cliente","diseno","codigo","calidad"];
const RANGO = { cliente:[1,9], diseno:[1,9], codigo:[1,9], calidad:[2,5] };
const FIJO = { cliente:3, diseno:7, codigo:5, calidad:4 };   // código de respaldo si se juega sin conexión: 3 - 7 - 5 - 4
const NUM = ["CERO","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE"];
function sortearCodigo(){ const c = {}; ORDEN_P.forEach(k => { const [a,b] = RANGO[k]; c[k] = a + Math.floor(Math.random() * (b - a + 1)); }); return c; }
/* azar "con semilla": la misma partida arma siempre el mismo desafío, aunque se recargue la página */
function rngFrom(str){
  let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const barajar = (r, a) => { a = [...a]; for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* --- helpers de contenido --- */
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ABC_ROW = ABC.split("").join(" ");
const K = w => `<span class="kw">${w}</span>`, N = w => `<span class="num">${w}</span>`, F = w => `<span class="fn">${w}</span>`;
function gloss(items){ return `<div class="gloss">${items.map(i => `<span>${i}</span>`).join("")}</div>`; }
function formPhone(tag, tagColor, title, rows, btnTxt, broken){
  return `
    <div class="phone" aria-label="${tag}">
      <span class="tag" style="background:${tagColor}">${tag}</span>
      <h4>${esc(title)}</h4>
      ${rows.map(r => `<div class="f"><span class="lbl">${esc(r[0])}</span><span class="val">${esc(r[1])}</span></div>`).join("")}
      <div class="sendwrap${broken ? " broken" : ""}"><span class="send">${esc(btnTxt)}</span></div>
    </div>`;
}

const PISTAS = {
  /* ◆ 1 · CLIENTE — solo la palabra del número viene en clave */
  cliente: {
    n: 1, color: "#3EE6FF", sym: "◆", term: "TERMINAL 1 ◆ CLIENTE", side: true, hintsR: true, casos: 4,
    title: "El mensaje del cliente",
    intro: "Todo proyecto empieza escuchando al cliente. Pero una palabra de su mensaje llegó en clave.",
    mission: "Descifrá la palabra en clave.",
    stage: "Etapa 1: entender qué pide el cliente",
    placeholder: "Palabra",
    build(d, r, v){
      const w = NUM[d];
      const ctx = pick(r, ["Instalen el servidor nuevo en el aula", "Guarden la copia de seguridad en el estante",
                           "Las notebooks nuevas van al laboratorio", "El formulario de inscripción tiene que tener esta cantidad de pasos:"]);
      const corrido = (s, k) => s.split("").map(c => ABC[(ABC.indexOf(c) + k + 26) % 26]).join("");
      const atrasLetras = (c, k) => Array.from({length:k + 1}, (_, i) => ABC[(ABC.indexOf(c) - i + 26) % 26]).join(" → ");
      let enc, clave, how, h1, fact, extra = "", big = "";
      if(v === 0 || v === 1){
        const k = v === 0 ? 3 : 1; enc = corrido(w, k);
        clave = `A → ${ABC[k]}`;
        how = k === 3 ? "Cada letra está 3 lugares más adelante que la verdadera. Buscá cada letra en el abecedario y volvé 3 lugares para atrás."
                      : "Cada letra está 1 lugar más adelante que la verdadera. Buscá cada letra en el abecedario y fijate cuál está justo antes.";
        h1 = `Ejemplo con la primera letra: ${atrasLetras(enc[0], k)}. La primera letra es ${w[0]}. Hacé lo mismo con las demás.`;
        fact = `Acabás de <b>descifrar</b> un mensaje con el <b>cifrado César</b>${k === 1 ? " (corrimiento de 1)" : ""}, que según se cuenta usaba Julio César. Hoy tus mensajes de WhatsApp también viajan cifrados, con claves mucho más difíciles.`;
      } else if(v === 2){
        enc = w.split("").map(c => ABC.indexOf(c) + 1).join("·"); big = "font-size:clamp(30px,4.4vw,56px);letter-spacing:.06em";
        clave = "A = 1, B = 2, C = 3…";
        how = "Cada número es una letra: el 1 es la A, el 2 es la B, el 3 es la C… Contá en el abecedario para saber qué letra es cada número.";
        h1 = `Ejemplo: el ${ABC.indexOf(w[0]) + 1} es la ${w[0]} (contá desde la A). Hacé lo mismo con los demás números.`;
        fact = "Acabás de <b>descifrar</b> un mensaje donde cada letra era un número. Las computadoras guardan todo así: cada letra que escribís se convierte en un número.";
      } else {
        enc = w.split("").map(c => ABC[25 - ABC.indexOf(c)]).join("");
        clave = "A ↔ Z · B ↔ Y";
        how = "Abajo del abecedario está el mismo abecedario dado vuelta. Buscá cada letra en la fila celeste y mirá qué letra tiene justo arriba.";
        h1 = `Ejemplo: la ${enc[0]} de la fila celeste tiene arriba la ${w[0]}. La primera letra es ${w[0]}. Hacé lo mismo con las demás.`;
        fact = "Acabás de <b>descifrar</b> un mensaje con el <b>cifrado Atbash</b>, que da vuelta el abecedario. Hoy tus mensajes de WhatsApp también viajan cifrados, con claves mucho más difíciles.";
        extra = `<div class="abc" style="color:var(--cyan)">${ABC_ROW.split(" ").reverse().join(" ")}</div>`;
      }
      return {
        how, fact, hint1: h1,
        hint2: `Ya está casi todo: ${w.slice(0, -1).split("").join(" ")} _ · Falta la última letra.`,
        check: x => [w, String(d)].includes(norm(x)),
        content: () => `
          <div class="clientmsg"><span class="px">MENSAJE DEL CLIENTE</span><p>«${esc(ctx)} <b class="enc">${esc(enc)}</b>»</p></div>
          <div class="cipher" style="${big}" aria-label="Palabra en clave: ${esc(enc.split("").join(" "))}">${esc(enc)}</div>
          <p class="mono" style="text-align:center;font-size:20px;color:var(--yellow);margin:0">Pista del cliente: ${clave}</p>
          <div class="abc">${ABC_ROW}</div>${extra}`
      };
    }
  },

  /* ★ 2 · DISEÑO — armar el botón siguiendo el manual de marca; al coincidir aparece el número */
  diseno: {
    n: 2, color: "#5CF28B", sym: "★", term: "TERMINAL 2 ★ DISEÑO", side: true, hintsR: true, casos: 4,
    title: "El botón de inscripción",
    intro: "",
    mission: "Armá el botón «Inscribirme» igual que en el manual de marca del cliente.",
    how: "Usá los controles. A la derecha ves el botón en vivo y el CSS que se escribe solo. Si coincide con el manual, aparece el número.",
    stage: "Etapa 2: diseño web",
    live: true,
    fact: "Usaste <b>CSS</b>, el lenguaje que decide cómo se ve cada página web. Cada línea tiene una <b>propiedad</b> (background, color, border-radius…) y un <b>valor</b>. Los diseñadores web siguen el <b>manual de marca</b> del cliente para que todo se vea igual en cada pantalla.",
    build(d, r, v){
      const FONDOS = [ ["violeta","#5B3FD6"], ["lila","#B49CF0"], ["verde","#1E8E5A"], ["amarillo","#FFC93C"], ["azul","#1F5FBF"], ["rojo","#D93838"], ["gris","#8A86A0"] ];
      const ESQ = [ ["recto","0px"], ["redondeado","12px"], ["píldora","999px"] ];
      const ESQ_L = { "recto":"recto", "redondeado":"redondo", "píldora":"píldora" };
      const MARCAS = [
        { quien:"Instituto 125", fondo:"violeta", letra:"white", esq:"redondeado", px:24, may:true },
        { quien:"Biblioteca 125", fondo:"verde", letra:"white", esq:"píldora", px:20, may:false },
        { quien:"Centro de estudiantes", fondo:"amarillo", letra:"black", esq:"recto", px:28, may:true },
        { quien:"Secretaría 125", fondo:"azul", letra:"white", esq:"redondeado", px:32, may:false }
      ];
      const M = MARCAS[v];
      const hex = n => FONDOS.find(f => f[0] === n)[1];
      const esqTxt = { "recto":"esquinas rectas", "redondeado":"esquinas redondeadas", "píldora":"forma de píldora (bien redonda)" };
      const st = { fondo:"gris", letra:"black", esq:"recto", px:12, may:false };   // arranca mal a propósito
      if(M.letra === "black") st.letra = "white";
      const faltan = () => [st.fondo !== M.fondo, st.letra !== M.letra, st.esq !== M.esq, st.px !== M.px, st.may !== M.may].filter(Boolean).length;
      const css = (cambio) => {
        const L = [
          ["fondo", `background: ${N(hex(st.fondo))};`, `/* ${st.fondo} */`],
          ["letra", `color: ${N(st.letra)};`, `/* ${st.letra === "white" ? "blanca" : "negra"} */`],
          ["esq", `border-radius: ${N(ESQ.find(e => e[0] === st.esq)[1])};`, `/* ${st.esq} */`],
          ["px", `font-size: ${N(st.px + "px")};`, `/* tamaño */`],
          ["may", `text-transform: ${N(st.may ? "uppercase" : "none")};`, `/* ${st.may ? "mayúsculas" : "normal"} */`]
        ];
        return `<div><span class="fn">.boton</span> {</div>` + L.map(l => `<div class="cl${l[0] === cambio ? " hot" : ""}">  ${l[1].replace(/^([a-z-]+):/, '<span class="kw">$1</span>:')} <span class="cm">${l[2]}</span></div>`).join("") + `<div>}</div>`;

  /* ● 3 · CÓDIGO — un programa que, al terminar, muestra el número */
  codigo: {
    n: 3, color: "#FFD23F", sym: "●", term: "TERMINAL 3 ● CÓDIGO", side: true, hintsR: true, casos: 5,
    title: "El código",
    intro: "Antes de ejecutar un programa, hay que saber qué va a mostrar.",
    mission: "Averiguá qué número muestra el programa en la consola.",
    how: "x es una cajita que guarda un número. Seguí las líneas en orden y anotá cuánto vale x. Lo que muestra «print» es la respuesta.",
    stage: "Etapa 3: programar",
    placeholder: "Número",
    build(d, r, v){
      /* el programa se arma como una lista de instrucciones; se dibuja y se "ejecuta" para armar las pistas */
      let ops, fact;
      if(v === 0){
        let k = d >= 7 && r() < .5 ? 2 : 1, n = Math.min(3, Math.floor(d / k)) >= 2 ? pick(r, [2, 3].filter(x => x * k <= d)) : 1;
        ops = [["set", d - n * k], ["rep", n, [["add", k]]]];
        fact = "Leíste un <b>programa</b>: la computadora sigue las instrucciones en orden, y <b>repeat</b> es un <b>bucle</b> que repite lo de adentro. Hacerlo a mano como vos se llama <b>prueba de escritorio</b>.";
      } else if(v === 1){
        const p = pick(r, [2,3,4]), q = pick(r, [1,2,3]);
        ops = [["set", d + p + q], ["sub", p], ["sub", q]];
        fact = "Leíste un <b>programa</b>: la computadora sigue las instrucciones <b>en orden</b>, una por una, y cada línea cambia el valor guardado en x (una <b>variable</b>).";
      } else if(v === 2){
        ops = [["set", 1], ["rep", 2, [["mul", 2]]]];

        fact = "Leíste un <b>programa</b>: lo que está corrido a la derecha queda <b>adentro</b> del bucle <b>repeat</b>; lo demás se hace una sola vez. Hacerlo a mano se llama <b>prueba de escritorio</b>.";
      } else if(v === 3){

        if(r() < .5){ b = Math.max(1, 6 - d) + pick(r, [0, 1]); a = d + b; si = true; }
        else{ b = Math.max(1, d - 5) + (d - Math.max(1, d - 5) - 1 > 0 ? pick(r, [0, 1]) : 0); a = d - b; si = false; }
        ops = [["set", a], ["if", 5, [["sub", b]], [["add", b]]]];
        fact = "Leíste una <b>condición</b>: <b>if</b> (si) pregunta algo y, según la respuesta, el programa hace una cosa o la otra (<b>else</b>, si no). Así deciden todos los programas.";
      } else {
        ops = [["set", 0], ["rep", d, [["add", 1]]]];
        fact = "Leíste un <b>programa</b>: <b>repeat</b> es un <b>bucle</b> que repite lo de adentro las veces que le digas. Así un programa puede hacer lo mismo miles de veces sin cansarse.";
      }
      /* dibujar */
      const lines = [];
      const sym = { add:"+", sub:"-", mul:"*" };
      const draw = (list, ind) => list.forEach(o => {
        const sp = "    ".repeat(ind);
        if(o[0] === "set") lines.push(`${sp}x = ${N(o[1])}`);
        else if(o[0] === "rep"){ lines.push(`${sp}${K("repeat")} ${N(o[1])} ${K("times")}:`); draw(o[2], ind + 1); }
        else if(o[0] === "if"){ lines.push(`${sp}${K("if")} x &gt; ${N(o[1])}:`); draw(o[2], ind + 1); lines.push(`${sp}${K("else")}:`); draw(o[3], ind + 1); }
        else lines.push(`${sp}x = x ${sym[o[0]]} ${N(o[1])}`);
      });
      draw(ops, 0); lines.push(`${F("print")}(x)`);
      /* ejecutar, anotando cada paso para las pistas */
      const pasos = []; let x = 0;
      const val = (o, x) => o[0] === "add" ? x + o[1] : o[0] === "sub" ? x - o[1] : x * o[1];
      const verbo = { add:"se le suma", sub:"se le resta", mul:"se multiplica por" };
      const run = (list, vuelta) => list.forEach(o => {

      run(ops);

        hint2: (pasos.length > 5 ? [pasos[0], pasos[1], "…", pasos[pasos.length - 2], ultimo] : [...pasos.slice(0, -1), ultimo]).join(" ") + " Lo que muestra print es ese último valor de x.",
        check: s => [String(d), NUM[d]].includes(norm(s)),
        content: () => `

            <div class="ed-bar"><span class="dot" style="background:#FF4FA3"></span><span class="dot" style="background:#FFD23F"></span><span class="dot" style="background:#5CF28B"></span><span class="ed-file">inscripciones.code</span><span class="ed-tag">CÓDIGO</span></div>

          </div>
          <p class="code-note">Esto es un <b>programa</b>: la computadora ejecuta las líneas en orden, de arriba hacia abajo, y va guardando números en <b>x</b>.</p>
          ${gloss(g)}`
      };
    }
  },

/* elige una variante al azar, sin repetir la última que salió en esta computadora */
function pickVariant(key){
  const vs = { length: PISTAS[key].casos }, k = "e500-var-" + key;
  let last = -1; try{ last = +localStorage.getItem(k); }catch(e){}
  let i = Math.floor(Math.random() * vs.length);
  if(vs.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (vs.length - 1))) % vs.length;
  try{ localStorage.setItem(k, i); }catch(e){}
  return i;
}
const store = {

/* =========================================================
   CONEXIÓN EN TIEMPO REAL
   El servidor manda el estado de la partida; cada terminal avisa cuando resuelve su desafío.
   · Si FIREBASE_URL tiene la dirección de una Realtime Database de Firebase, se usa esa (sin límite práctico).
   · Si está vacía, se usa ntfy.sh (servicio público, gratis, sin cuenta, con límite diario de mensajes).
   SALA es el "canal": se puede pisar con ?sala=nombre para probar sin mezclarse con otra partida.
   ========================================================= */
const FIREBASE_URL = "https://error500-isfdyt125-default-rtdb.firebaseio.com";   // dejar vacío ("") para usar ntfy.sh
const QS = new URLSearchParams(location.search);
const SALA = (QS.get("sala") || "isfdyt125-error500-k7q3").replace(/[^\w-]/g, "").slice(0, 64);
const DB = (QS.get("db") || FIREBASE_URL).replace(/\/$/, "");
const NTFY = (QS.get("ntfy") || "https://ntfy.sh").replace(/\/$/, "");
const VIA = DB ? "firebase" : "ntfy";
const ME = Math.random().toString(36).slice(2, 9);
const NET = { ok:null, ready:false, lastId:null, seen:new Set(), es:null, retry:null, skew:0, queue:[], sending:false, on:null };
let bc = null; try{ bc = new BroadcastChannel("e500-" + SALA); }catch(e){}

function netPaint(){
  document.querySelectorAll("[data-net]").forEach(el => {
    el.className = "net " + (NET.ok ? "on" : NET.ok === false ? "off" : "");
    el.textContent = NET.ok ? "● EN LÍNEA" : NET.ok === false ? "○ SIN CONEXIÓN" : "○ CONECTANDO…";
  });
}
function netStatus(ok){ if(NET.ok !== ok){ NET.ok = ok; netPaint(); if(NET.on) NET.on({ k:"_net" }); } }

function recibir(d, recv, live){
  if(!d || !d.k || !d.u || NET.seen.has(d.u)) return;
  NET.seen.add(d.u);
  d._recv = recv;              // cuándo se envió, en el reloj de ESTA notebook
  if(NET.on) NET.on(d, live);
}
if(bc) bc.onmessage = e => recibir(e.data, Date.now(), true);

/* enviar: todo pasa por una cola, así si se corta internet se manda cuando vuelve */
function enviar(d){
  d.u = ME + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  d.t = Date.now();
  NET.seen.add(d.u);
  try{ if(bc) bc.postMessage(d); }catch(e){}
  NET.queue.push({ d }); vaciarCola();
}
/* el servidor borra los mensajes viejos al empezar cada grupo (solo Firebase) */
function limpiarSala(){ if(VIA === "firebase"){ NET.queue.push({ borrar:true }); vaciarCola(); } }
function vaciarCola(){
  if(NET.sending || !NET.queue.length) return;
  NET.sending = true;
  const it = NET.queue[0];
  const req = VIA === "firebase"
    ? (it.borrar ? fetch(`${DB}/salas/${SALA}/msgs.json`, { method:"DELETE" })
                 : fetch(`${DB}/salas/${SALA}/msgs.json`, { method:"POST", body:JSON.stringify({ ...it.d, ts:{ ".sv":"timestamp" } }) }))
    : fetch(NTFY + "/" + SALA, { method:"POST", body:JSON.stringify(it.d) });
  req.then(r => { if(!r.ok) throw new Error(r.status); NET.queue.shift(); netStatus(true); })
    .catch(() => { netStatus(false); return new Promise(ok => setTimeout(ok, 3000)); })
    .finally(() => { NET.sending = false; vaciarCola(); });
}
function conectar(){ (VIA === "firebase" ? conectarFirebase : conectarNtfy)(); }

/* --- ntfy.sh --- */
function desdeNtfy(m, live){
  if(!m) return;
  if(m.time && live) NET.skew = Date.now() - (m.time * 1000 + 500);
  if(m.event !== "message") return;
  NET.lastId = m.id;
  let d; try{ d = JSON.parse(m.message); }catch(e){ return; }
  recibir(d, live ? Date.now() : m.time * 1000 + 500 + NET.skew, live);
}
function conectarNtfy(){
  clearTimeout(NET.retry);
  try{ if(NET.es) NET.es.close(); }catch(e){}
  fetch(`${NTFY}/${SALA}/json?poll=1&since=${NET.lastId || "30m"}`)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(txt => {
      txt.split("\n").filter(Boolean).forEach(l => { try{ desdeNtfy(JSON.parse(l), false); }catch(e){} });
      NET.ready = true; netStatus(true); if(NET.on) NET.on({ k:"_sync" });
      const es = new EventSource(`${NTFY}/${SALA}/sse` + (NET.lastId ? `?since=${NET.lastId}` : ""));
      es.onmessage = e => { try{ desdeNtfy(JSON.parse(e.data), true); }catch(err){} };
      es.addEventListener("open", e => { netStatus(true); try{ if(e.data) desdeNtfy(JSON.parse(e.data), true); }catch(err){} });
      es.addEventListener("keepalive", e => { try{ desdeNtfy(JSON.parse(e.data), true); }catch(err){} });
      es.onerror = () => { netStatus(false); es.close(); NET.retry = setTimeout(conectarNtfy, 3000); };
      NET.es = es;
    })
    .catch(() => { NET.ready = true; netStatus(false); if(NET.on) NET.on({ k:"_sync" }); NET.retry = setTimeout(conectarNtfy, 4000); });
}

/* --- Firebase Realtime Database (por su API REST, sin librerías) --- */
function desdeFirebase(m, live){
  if(!m || typeof m !== "object" || !m.k) return;
  const ts = typeof m.ts === "number" ? m.ts : Date.now() - NET.skew;
  if(live) NET.skew = Date.now() - ts;
  recibir(m, live ? Date.now() : ts + NET.skew, live);
}
function conectarFirebase(){
  clearTimeout(NET.retry);
  try{ if(NET.es) NET.es.close(); }catch(e){}
  /* la hora del servidor de Firebase, para que todos los relojes coincidan */
  const t0 = Date.now();
  fetch(`${DB}/salas/${SALA}/hora/${ME}.json`, { method:"PUT", body:JSON.stringify({ ".sv":"timestamp" }) })
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(ts => { const t1 = Date.now(); if(typeof ts === "number") NET.skew = (t0 + t1) / 2 - ts; abrirFirebase(); })
    .catch(() => { NET.ready = true; netStatus(false); if(NET.on) NET.on({ k:"_sync" }); NET.retry = setTimeout(conectarFirebase, 4000); });
}
function abrirFirebase(){
  const es = new EventSource(`${DB}/salas/${SALA}/msgs.json`);
  let primero = true;
  const tomar = (e, parche) => {
    let x; try{ x = JSON.parse(e.data); }catch(err){ return; }
    if(!x) return;
    netStatus(true);
    if(x.path === "/" && !parche){
      /* foto completa: al conectar (o reconectar) llegan todos los mensajes de la partida */
      if(x.data) Object.keys(x.data).sort().forEach(k => desdeFirebase(x.data[k], false));
      if(primero){ primero = false; NET.ready = true; if(NET.on) NET.on({ k:"_sync" }); }
    } else if(parche){
      if(x.data) Object.keys(x.data).sort().forEach(k => desdeFirebase(x.data[k], true));
    } else desdeFirebase(x.data, true);
  };
  es.addEventListener("put", e => tomar(e, false));
  es.addEventListener("patch", e => tomar(e, true));

/* ---------------- terminal: un desafío ----------------

function renderPista(key, o = {}){

          <form class="answer" id="f" autocomplete="off">

          ${P.hintsR ? "" : hintsHTML}

        </div>
      </div>`;
    if(o.reset) bindReset(o.reset);
    if(o.paint) o.paint();

    document.getElementById("pedir").addEventListener("click", () => {
      if(hintUsed) return; hintUsed = true; SFX.warn();
      document.getElementById("pedir").hidden = true; document.getElementById("hint1").hidden = false;
      if(o.onHint) o.onHint();
    });
    const fail = (detalle) => {
      fails++; SFX.bad(); fb.className = "fb bad"; fb.textContent = `> ACCESO DENEGADO. Intento ${fails}.${detalle ? " " + detalle : ""}`;
      const t = app.querySelector(".term"); t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
      if(fails >= 2){   // la ayuda gratis reemplaza a la pista paga (es más completa)

      }

    if(P.live){

      const api = P.mount({
        onChange: () => SFX.key(),
        onSolve: () => { if(solved) return; solved = true; fb.className = "fb ok"; fb.textContent = "> ¡COINCIDE CON EL MANUAL!"; SFX.ok(); setTimeout(win, 1600); }
      });

      e.preventDefault(); if(solved) return;
      if(!input.value.trim()){ input.focus(); return; }

   Solo se reinicia cuando el servidor arranca una partida nueva. */
const T = { key:null, id:null, fase:null, end:0, res:new Set(), resultado:null, v:0, d:0, solved:false, hint:false, offline:false, tick:null, shown:"" };
const memT = () => store.set("e500-p-" + T.key, { id:T.id, v:T.v, d:T.d, solved:T.solved, hint:T.hint });
function terminal(key){
  Object.assign(T, { key, id:null, fase:null, end:0, res:new Set(), resultado:null, offline:false, shown:"" });
  const mem = store.get("e500-p-" + key);
  NET.on = (d, live) => {
    if(d.k === "estado" && T.offline && d.id !== T.id && d.fase !== "fin"){ T.offline = false; T.shown = ""; }   // vuelve a seguir al servidor
    if(d.k === "estado"){
      if(d.id !== T.id){
        T.id = d.id; T.res = new Set();
        const m = store.get("e500-p-" + key);
        if(m && m.id === d.id){ T.v = m.v; T.d = m.d; T.solved = m.solved; T.hint = !!m.hint; }
        else{ T.v = pickVariant(key); T.d = (d.cod && d.cod[key]) || FIJO[key]; T.solved = false; T.hint = false; memT(); }
      }
      if(d.cod && d.cod[key] && d.cod[key] !== T.d){ T.d = d.cod[key]; memT(); }
      T.fase = d.fase; T.resultado = d.resultado || null; T.info = d;
      if(d.fase === "jugando") T.end = d._recv + d.restante * 1000;
      if(live && d.aviso === "denegado") avisoTerminal(`EN EL SERVIDOR: ACCESO DENEGADO · −${PENALTY} SEG`);
      if(live && d.aviso === "pista" && d.de && PISTAS[d.de]) avisoTerminal(d.de === key ? `PISTA PEDIDA · −${PENALTY} SEG PARA TODO EL EQUIPO` : `${PISTAS[d.de].sym} TERMINAL ${PISTAS[d.de].n} PIDIÓ UNA PISTA · −${PENALTY} SEG`, "var(--yellow)");
      if(live && d.fase === "jugando" && d.aviso === "inicio") SFX.start();
      if(live && d.fase === "fin") (d.resultado === "ganado" ? SFX.win : SFX.lose)();
    }
    if(d.k === "resuelto" && d.id === T.id){
      T.res.add(d.pista);
      if(live && d.pista !== key) avisoTerminal(`${PISTAS[d.pista].sym} TERMINAL ${PISTAS[d.pista].n} RECUPERÓ SU FRAGMENTO`, PISTAS[d.pista].color);
    }
    pintarTerminal();
  };
  pintarTerminal();
  clearInterval(T.tick);
  T.tick = setInterval(() => {
    const el = document.getElementById("tclock"); if(!el) return;
    if(T.fase === "jugando" && !T.offline){
      const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
      el.textContent = fmt(left); el.className = "tclock" + (left <= 30 ? " crit" : left <= 60 ? " warn" : "");
    } else el.textContent = "";
  }, 250);
  /* si no hay conexión ni partida, a los 8 segundos se ofrece jugar sin conexión */
  setTimeout(pintarTerminal, 8000);
}
function pintarTerminal(){
  const key = T.key, P = PISTAS[key]; if(!key) return;
  if(T.offline) return;
  const ahora = T.id ? `${T.id}|${T.fase}|${T.fase === "jugando" ? "" : T.resultado}` : `nada|${NET.ok}|${NET.ready}|${performance.now() > 7500}`;
  if(ahora !== T.shown){
    T.shown = ahora;
    if(T.id && T.fase === "jugando"){
      renderPista(key, { v:T.v, d:T.d, seed:T.id + key, solved:T.solved, hint:T.hint, paint:pintarEquipo,
        onHint:() => { T.hint = true; memT(); enviar({ k:"pista", id:T.id, pista:key }); },
        onWin:() => { T.solved = true; T.res.add(key); memT(); enviar({ k:"resuelto", id:T.id, pista:key }); } });
    } else if(T.id && T.fase === "fin") finTerminal();

const S = { state:"idle", id:null, cod:null, end:0, tick:null, fails:0, res:new Set(), pistas:[], warned300:false, warned60:false, warned30:false, lastBeep:null };
function stopGame(){ clearInterval(S.tick); musicStop(); document.body.classList.remove("alarm"); }
function nuevaId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

function codigoOk(v){ return ORDEN_P.every((k, i) => +v[i] === S.cod[k] || +v[i] === FIJO[k]); }
function restante(){ return Math.max(0, Math.ceil((S.end - Date.now()) / 1000)); }
function publicarEstado(extra = {}){
  enviar({ k:"estado", id:S.id, cod:S.cod, fase:S.state === "playing" ? "jugando" : S.state === "idle" ? "espera" : "fin", restante:restante(), ...extra });
}
function servidor(){
  NET.on = (d, live) => {
    if(d.k === "resuelto" && d.id === S.id && !S.res.has(d.pista)){
      S.res.add(d.pista);
      pintarTablero();
      if(live && S.state === "playing"){ SFX.ok(); avisoTerminal(`${PISTAS[d.pista].sym} TERMINAL ${PISTAS[d.pista].n} · FRAGMENTO RECUPERADO`, PISTAS[d.pista].color); }
    }
    if(d.k === "pista" && d.id === S.id && S.state === "playing" && PISTAS[d.pista] && !S.pistas.includes(d.pista)){
      S.pistas.push(d.pista); S.end -= PENALTY * 1000; guardarS();
      publicarEstado({ aviso:"pista", de:d.pista });
      if(live){ SFX.denied(); avisoTerminal(`${PISTAS[d.pista].sym} TERMINAL ${PISTAS[d.pista].n} PIDIÓ UNA PISTA · −${PENALTY} SEG`, "var(--yellow)"); }
      updateClock();
    }
    if(d.k === "_net" || d.k === "_sync") netPaint();
  };
  const m = store.get("e500-srv-" + SALA);
  if(m && m.state === "playing" && m.end > Date.now()){
    Object.assign(S, m); S.res = new Set(); S.pistas = m.pistas || []; if(!S.cod) S.cod = { ...FIJO };
    jugando(true);
  } else renderServer(m && m.state === "idle" ? m.id : null);
}

  c.className = "clock" + (left <= 30 ? " crit" : left <= 60 ? " warn" : "");
  const banner = document.getElementById("banner");
  if(left <= 300 && !S.warned300){ S.warned300 = true; if(left > 290){ SFX.warn(); banner.hidden = false; banner.textContent = "⚠ QUEDAN 5 MINUTOS"; setTimeout(() => { if(S.state === "playing" && !S.warned60) banner.hidden = true; }, 5000); } music.bpm = 124; music.level = 1; }
  if(left <= 60 && !S.warned60){ S.warned60 = true; SFX.warn(); music.bpm = 140; music.level = 1; banner.hidden = false; banner.textContent = "⚠ QUEDA 1 MINUTO"; }
  if(left <= 30 && !S.warned30){ S.warned30 = true; SFX.warn(); music.bpm = 160; music.level = 2; banner.hidden = false; banner.textContent = "⚠ QUEDAN 30 SEGUNDOS"; document.body.classList.add("alarm"); }
  if(left <= 10 && left > 0 && S.lastBeep !== left){ S.lastBeep = left; SFX.beep(); banner.textContent = `⚠ ${left}`; }
  if(left <= 0) gameLost("time");
}
function nivelDe(left){ return left >= 360 ? "NIVEL: LEYENDAS DEL CÓDIGO" : left >= 180 ? "NIVEL: EQUIPO SENIOR" : left >= 60 ? "NIVEL: EQUIPO DE EMERGENCIA" : "NIVEL: SALVADOS POR UN PIXEL"; }
function gameWon(){
  const left = restante(), used = DURATION - left;
  S.state = "won"; stopGame(); SFX.win(); guardarS();
  const rank = nivelDe(left);
  publicarEstado({ resultado:"ganado", nivel:rank, restante:left });
  app.innerHTML = `
    <div class="term winterm">
      ${bar("servidor instituto-125 · en línea", false, `<span class="net" data-net></span>`)}
      <div class="body win">
        <p class="mono" style="color:var(--green)">$ status --servidor instituto-125 → 200 OK ✔</p>
        <h1 class="party" style="font-size:clamp(30px,4.6vw,58px)">SISTEMA RESTAURADO</h1>
        <div class="stats">
          <div><span class="px">TIEMPO</span><b>${fmt(used)}</b></div>
          <div><span class="px">SOBRARON</span><b>${fmt(left)}</b></div>
          <div><span class="px">INTENTOS</span><b>${S.fails + 1}/${MAX_TRIES}</b></div>
        </div>
        <p class="px" style="font-size:clamp(13px,2vw,18px);color:var(--yellow)">★ ${rank} ★</p>
        <h2>¡Salvaron las inscripciones del instituto!</h2>
        <p class="muted" style="max-width:60ch">Encontraron los errores, entendieron al cliente, leyeron código y arreglaron el diseño, en equipo y contra reloj. Eso es exactamente lo que hacemos en la <b style="color:var(--ink)">Tecnicatura en Desarrollo de Software</b>. ¿Se imaginan haciéndolo todos los días?</p>
        <div class="row c"><button class="btn big" id="again" type="button">▶ Siguiente grupo</button></div>
      </div>
    </div>`;
  netPaint();
  document.getElementById("again").addEventListener("click", () => renderServer());
  confetti();
}
/* lluvia de píxeles para la celebración */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#FFD23F","#FF4FA3","#3EE6FF","#5CF28B","#F4F0FF"];
  const ps = Array.from({length:180}, () => ({ x: Math.random()*W, y: -Math.random()*H, s: 6 + Math.random()*10, v: 2 + Math.random()*4, d: (Math.random()-.5)*2, c: cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now();
  (function frame(t){
    x.clearRect(0,0,W,H);
    ps.forEach(p => { p.y += p.v; p.x += p.d; x.fillStyle = p.c; x.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
    if(t - t0 < 6000 && document.body.contains(c)) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function gameLost(reason){
  S.state = "lost"; stopGame(); SFX.lose(); guardarS();
  const locked = reason === "locked";
  publicarEstado({ resultado:locked ? "bloqueado" : "tiempo", restante:0 });
  app.innerHTML = `
    <div class="term alert">
      ${bar("ALERTA · servidor instituto-125", true, `<span class="net" data-net></span>`)}
      <div class="body win">
        <p class="mono" style="color:var(--red)">$ status --servidor instituto-125 → ${locked ? "423 LOCKED" : "500"}</p>
        <h1 style="color:var(--red);font-size:clamp(32px,6vw,68px)">${locked ? "SISTEMA<br>BLOQUEADO" : "SE ACABÓ<br>EL TIEMPO"}</h1>
        <h2>${locked ? `Usaron los ${MAX_TRIES} intentos y el sistema se bloqueó por seguridad.` : "El servidor sigue caído… por ahora."}</h2>
        <p class="muted" style="max-width:52ch">En la vida real también pasa: se aprende, se revisa qué falló y se vuelve a intentar. Pidan ayuda al equipo y descubran juntos cuál era el código.</p>
        <div class="row c"><button class="btn big" id="again" type="button">▶ Siguiente grupo</button></div>
      </div>
    </div>`;
  netPaint();
  document.getElementById("again").addEventListener("click", () => renderServer());
}

/* ---------------- menú (lo usa el equipo para preparar cada notebook) ---------------- */
function renderMenu(){
  stopGame();
  NET.on = d => {
    if(d.k === "_net" || d.k === "_sync") netPaint();
    if(d.k === "estado" && d.cod){ const el = document.getElementById("codnow"); if(el) el.textContent = ORDEN_P.map(k => d.cod[k]).join(" - "); }
  };
  const base = location.origin + location.pathname + location.search;
  const dir = h => esc((base + "#" + h).replace(/^https?:\/\//, ""));
  const card = (h, c, tag, t) => `<a class="card" href="#${h}" style="--c:${c}"><b>${tag}</b><strong>${t}</strong><code>${dir(h)}</code></a>`;
  app.innerHTML = `
    <div class="menu">
      <div class="menu-h">
        <div><span class="px small" style="font-size:11px">ISFDyT N° 125 · NOCHE DEL INSTITUTO</span><h1>ERROR 500</h1></div>
        <div class="menu-net"><span class="net" data-net></span><span class="px small" style="font-size:10px">SALA: ${esc(SALA)} · ${VIA === "firebase" ? "FIREBASE" : "NTFY.SH"}</span><span class="px small" style="font-size:10px">CÓDIGO DE LA PARTIDA: <b id="codnow" style="color:var(--yellow)">—</b></span></div>
      </div>
      <p class="muted" style="font-size:18px">Abrí en cada notebook su dirección (o tocá su tarjeta). Quedan conectadas entre sí: el servidor inicia la partida y todas se reinician juntas al terminar.</p>
      <div class="cards">
        ${card("servidor", "#F4F0FF", "■ SERVIDOR · PROYECTOR", "Timer, música y código final · desde acá se inicia cada partida")}
        ${card("cliente", "#3EE6FF", "1 ◆ CLIENTE", "Descifrar el mensaje del cliente")}
        ${card("diseno", "#5CF28B", "2 ★ DISEÑO", "Arreglar el diseño de la página")}
        ${card("codigo", "#FFD23F", "3 ● CÓDIGO", "Leer un programa")}
        ${card("calidad", "#FF4FA3", "4 ▲ CALIDAD", "Encontrar los errores")}
      </div>
      <p class="small">Para el equipo: <b>Ctrl + Alt + R</b> reinicia a mano cualquier notebook (sirve sin internet). En el servidor corta la partida; en una terminal pone un caso nuevo.</p>
    </div>`;
  netPaint();
}

/* ---------------- router ---------------- */
function route(){
  const sb = document.getElementById("snd"); if(sb){ sb.hidden = (location.hash || "") !== "#servidor"; pintarSonido(); }
  clearInterval(T.tick); T.key = null;
  const h = (location.hash || "").replace("#","");
  if(PISTAS[h]) terminal(h);
  else if(h === "servidor") servidor();
  else renderMenu();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { stopGame(); route(); });
/* reinicio manual de emergencia (no necesita internet): Ctrl + Alt + R
   · en una terminal: caso nuevo y desafío listo para jugar; vuelve a seguir al servidor en la próxima partida
   · en el servidor: corta la partida y queda listo para el próximo grupo */
document.addEventListener("keydown", e => {
  if(!(e.ctrlKey && e.altKey && e.code === "KeyR")) return;
  e.preventDefault();
  const h = (location.hash || "").replace("#","");
  if(h === "servidor"){ renderServer(); avisoTerminal("REINICIO MANUAL · LISTO PARA EL PRÓXIMO GRUPO", "var(--yellow)"); }
  else if(PISTAS[h]){ manualTerminal(); avisoTerminal("REINICIO MANUAL · CASO NUEVO", "var(--yellow)"); }
});
document.addEventListener("pointerdown", () => ac(), { once:true });

/* pantalla completa (opcional) */
document.getElementById("snd").addEventListener("click", () => { setSonido((SONIDO + 2) % 3); if(SONIDO > 0){ ac(); SFX.key(); } });
document.getElementById("fs").addEventListener("click", () => {
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }catch(e){}
});

conectar();
route();
</script>
